name: Auto Empty Commit

on:
  schedule:
    # Run every 30 days at midnight UTC
    - cron: '0 0 */30 * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create empty commit and push
        run: |
          git commit --allow-empty -m "chore: automated empty commit"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}

